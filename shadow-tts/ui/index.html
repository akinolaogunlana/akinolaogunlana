<!doctype html>
<html>
<head><meta charset="utf-8"><title>Shadow TTS</title></head>
<body>
  <h1>Shadow Psychology TTS</h1>
  <p>Use the hosted API endpoint to render audio.</p>
  <textarea id="text" rows="10" cols="80"></textarea><br>
  <label><input type="checkbox" id="shadow" checked> Shadow Mode</label>
  <label>Pause Intensity <input type="range" id="intensity" min="0.5" max="2" step="0.1" value="1"></label>
  <button id="go">Render</button>
  <pre id="out"></pre>
<script>
const endpoint = localStorage.getItem('shadow_api') || 'https://YOUR-ENDPOINT/render';
document.getElementById('go').onclick = async () => {
  const payload = {
    text: document.getElementById('text').value,
    shadow_mode: document.getElementById('shadow').checked,
    pause_intensity: Number(document.getElementById('intensity').value)
  };
  const res = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  document.getElementById('out').textContent = await res.text();
};
</script>
</body>
</html>
